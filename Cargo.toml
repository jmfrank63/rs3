[package]
name = "rs3"
version = "0.2.0"
authors = ["johannes"]
edition = "2024"
rust-version = "1.99"
license = "MIT"

# One package: the rs3 library (src/lib.rs) and the rs3 binary (src/main.rs) are
# auto-discovered. See https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = { version = "4.19.0", default-features = false, features = ["macros"] }
deno_core = "0.413.0"
# Must stay "0.7": deno_core pins deno_error =0.7.1. Never `cargo add` it.
deno_error = "0.7"
papaya = "0.2.5"
config = { version = "0.15.27", default-features = false }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
# JS worker runtimes and the job queue; the same tokio deno_core already pulls in.
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
redb = "4.5.0"
blake3 = "1.8.7"
openraft = { version = "=0.9.26", features = ["serde", "storage-v2"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
reed-solomon-simd = "3.1.0"
candle-core = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
rayon = "1.12.0"

[dev-dependencies]
# Unprotected V8 platform for test builds only, so libtest's threads can create isolates.
# Phase 4 fallback (research question 1): move this feature to [dependencies] if x86 CI crashes.
deno_core = { version = "0.413.0", features = ["unsafe_use_unprotected_platform"] }
# tokio::join! in the concurrency tests; the graph already enables this feature.
tokio = { version = "1.54.1", features = ["macros"] }
sha2 = "0.10.9"

# Debug-built model inference is unusably slow, so the numeric dependencies are optimized.
[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 3

[profile.dev.package.tokenizers]
opt-level = 3

[profile.dev.package.rayon]
opt-level = 3

[profile.dev.package.rayon-core]
opt-level = 3

[profile.dev.package.half]
opt-level = 3

[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.gemm-f64]
opt-level = 3

[profile.dev.package.gemm-c32]
opt-level = 3

[profile.dev.package.gemm-c64]
opt-level = 3

[profile.dev.package.onig]
opt-level = 3

[profile.dev.package.safetensors]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
